<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- 3×3 matrix mark, optimised for small sizes -->
  <!-- Row 1 -->
  <rect x="4"  y="4"  width="26" height="26" rx="4" fill="#00d4b4" fill-opacity="1.00"/>
  <rect x="37" y="4"  width="26" height="26" rx="4" fill="#00d4b4" fill-opacity="0.55"/>
  <rect x="70" y="4"  width="26" height="26" rx="4" fill="#00d4b4" fill-opacity="0.20"/>
  <!-- Row 2 -->
  <rect x="4"  y="37" width="26" height="26" rx="4" fill="#00d4b4" fill-opacity="0.55"/>
  <rect x="37" y="37" width="26" height="26" rx="4" fill="#00d4b4" fill-opacity="1.00"/>
  <rect x="70" y="37" width="26" height="26" rx="4" fill="#00d4b4" fill-opacity="0.55"/>
  <!-- Row 3 -->
  <rect x="4"  y="70" width="26" height="26" rx="4" fill="#00d4b4" fill-opacity="0.20"/>
  <rect x="37" y="70" width="26" height="26" rx="4" fill="#00d4b4" fill-opacity="0.55"/>
  <rect x="70" y="70" width="26" height="26" rx="4" fill="#00d4b4" fill-opacity="1.00"/>
</svg>
